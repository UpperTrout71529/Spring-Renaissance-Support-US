<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spring Renaissance | Curator Chat</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Brought in line with the sr-*.liquid section tokens used on
               the main site (ink / cream / bronze), instead of the looser
               tan-and-off-white the widget had before. */
            --bg-color: #fbfbf9;
            --bg-desktop-surround: #f2ede6;
            --text-color: #1a1918;
            --accent-color: #9a7b52;
            --muted-text: rgba(26, 25, 24, 0.55);
            --input-bg: #ffffff;
            --input-border: rgba(26, 25, 24, 0.12);
            --button-bg: #1a1918;
            --button-text: #fbfbf9;
            --card-bg: #ffffff;
            --sr-serif: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
            --sr-sans: 'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--sr-sans);
            font-weight: 300;
            line-height: 1.6;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
        }

        .cinematic-fade {
            opacity: 0;
            filter: blur(4px);
            transform: translateY(20px);
            transition: opacity 1.2s cubic-bezier(0.215, 0.610, 0.355, 1),
                        filter 1.2s cubic-bezier(0.215, 0.610, 0.355, 1),
                        transform 1.2s cubic-bezier(0.215, 0.610, 0.355, 1);
        }

        .cinematic-fade.is-visible {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
        }

        main {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            padding: 40px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        section#chat-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex: 1;
            margin-bottom: 0;
        }

        .sr-kicker {
            font-family: var(--sr-sans);
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--accent-color);
            text-align: center;
            display: block;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .section-title {
            font-family: var(--sr-serif);
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-color);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-align: center;
            flex-shrink: 0;
        }

        .section-subtitle {
            font-family: var(--sr-sans);
            font-size: 0.7rem;
            font-weight: 300;
            font-style: italic;
            color: var(--muted-text);
            display: block;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .chat-space {
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex: 1;
            overflow-y: auto;
            padding: 10px 4px;
            margin-bottom: 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .chat-space::-webkit-scrollbar {
            width: 3px;
        }
        .chat-space::-webkit-scrollbar-thumb {
            background: var(--input-border);
            border-radius: 10px;
        }

        .msg-wrapper {
            display: flex;
            width: 100%;
            animation: msgFadeIn 0.5s ease forwards;
        }

        @keyframes msgFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-wrapper.bot {
            justify-content: flex-start;
        }

        .msg-wrapper.user {
            justify-content: flex-end;
        }

        .msg-card {
            max-width: 85%;
            padding: 20px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .msg-wrapper.bot .msg-card {
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            border-left: 2px solid var(--accent-color);
            color: var(--text-color);
            box-shadow: 0 4px 20px rgba(26, 25, 24, 0.02);
        }

        .msg-wrapper.user .msg-card {
            background: var(--button-bg);
            color: var(--button-text);
            font-weight: 300;
            border-radius: 4px;
        }

        .curator-typing {
            font-family: var(--sr-serif);
            font-style: italic;
            color: var(--muted-text);
            font-size: 1.1rem;
            padding-left: 10px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding-right: 6px;
            padding-left: 14px;
            box-shadow: 0 2px 10px rgba(26, 25, 24, 0.02);
            transition: all 0.4s ease;
            position: relative;
            flex-shrink: 0;
        }

        .input-group:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(154, 123, 82, 0.1);
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            background: none;
            border: none;
            padding: 16px 0;
            font-family: var(--sr-sans);
            color: var(--text-color);
            font-size: 16px;
            font-weight: 300;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="text"]::placeholder {
            color: var(--muted-text);
            font-size: 0.9rem;
            font-style: italic;
        }

        .icon-action-btn {
            background: none;
            border: none;
            height: 44px;
            width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.3s ease;
            border-radius: 50%;
        }

        .icon-action-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-action-btn:active {
            color: var(--accent-color);
            transform: scale(0.95);
        }

        .reset-session-wrapper {
            text-align: center;
            margin-top: 12px;
            flex-shrink: 0;
        }

        .reset-session-btn {
            background: none;
            border: none;
            color: var(--muted-text);
            font-family: var(--sr-sans);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px 12px;
        }

        .reset-session-btn:hover {
            color: var(--accent-color);
        }

        .concierge-action-block {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--input-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .concierge-luxury-btn {
            display: block;
            background: var(--button-bg);
            color: var(--button-text);
            padding: 14px 18px;
            border-radius: 2px;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            transition: background 0.3s ease, letter-spacing 0.3s ease;
        }

        .concierge-luxury-btn:hover {
            letter-spacing: 0.26em;
        }

        .concierge-luxury-btn:active {
            background: var(--accent-color);
        }

        @media (max-width: 480px) {
            main { padding-top: 20px; }
            .section-title { margin-bottom: 12px; font-size: 1.3rem; }
        }

        /* Standalone / desktop viewing: this page is normally embedded in a
           fixed ~400px widget frame, so it rarely needs its own desktop
           layout — but opened directly in a full browser tab it should
           read as a considered window, not a mobile page stretched thin. */
        @media (min-width: 700px) and (min-height: 640px) {
            html, body { position: static; overflow: auto; }
            body {
                min-height: 100%;
                background: var(--bg-desktop-surround);
                align-items: center;
                justify-content: center;
                padding: 6vh 20px;
            }
            main {
                height: 82vh;
                max-height: 760px;
                background: var(--bg-color);
                border: 1px solid var(--input-border);
                border-radius: 18px;
                box-shadow: 0 30px 90px rgba(26, 25, 24, 0.14);
                padding: 44px 32px 24px;
            }
        }
    </style>
</head>
<body>

    <main>
        <section class="cinematic-fade" id="chat-section">
            <span class="sr-kicker">Private Concierge</span>
            <h2 class="section-title">
                The Curator
                <span class="section-subtitle">Bespoke assistance, one exchange at a time</span>
            </h2>

            <div class="chat-space" id="chatSpace"></div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="chatInputField" placeholder="Inquire about the collection philosophy..." autocomplete="off">
                </div>

                <button class="icon-action-btn" id="sendChatBtn" aria-label="Send">
                    <svg viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>

            <div class="reset-session-wrapper">
                <button id="resetSessionBtn" class="reset-session-btn">Start New Session</button>
            </div>
        </section>
    </main>

    <script>
        const PIPEDREAM_WORKFLOW_URL = "https://sr-support.sagradyanfelix.workers.dev/";
        const STORAGE_KEY = "sr_curator_chat_history";
        const SITE_ORIGIN = "https://springrenaissance.store";
        const CLUB_PORTAL_URL = "https://club.springrenaissance.store";
        const CONCIERGE_EMAIL = "concierge@springrenaissance.store";

        // Human-readable labels for the handles the concierge prompt is
        // allowed to tag — kept as an explicit map (rather than only the
        // auto-humanized fallback below) so accents and proper casing
        // survive for the known catalogue. Anything tagged that isn't in
        // here still gets a reasonable label from humanizeHandle().
        const PRODUCT_LABELS = {
            'vendange-no-02': 'Vendange No. 02',
            'the-atelier-vignette-nocturne-01': 'The Atelier Vignette',
            'the-kouros-fragment': 'The Kouros Fragment',
            'the-suspended-contour': 'The Suspended Contour',
            'flacon-botanique': 'Flacon Botanique',
            'carafe-suspendue': 'Carafe Suspendue',
            'bougie-vasque': 'Bougie Vasque',
            'baume-solide': 'Baume Solide',
            'pierre-blanche': 'Pierre Blanche'
        };
        const COLLECTION_LABELS = {
            'decadent-heritage': 'Decadent Heritage',
            'the-nocturne-collection': 'The Nocturne Collection',
            'classical-anatomy': 'Classical Anatomy',
            'harmonic-contour': 'Harmonic Contour',
            'jardin-ferme': 'Jardin Fermé'
        };

        function humanizeHandle(handle) {
            return handle.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
        }

        function gmailComposeLink(subject) {
            return 'https://mail.google.com/mail/?view=cm&fs=1&to=' + CONCIERGE_EMAIL +
                (subject ? '&su=' + encodeURIComponent(subject) : '');
        }

        // Every tag the concierge prompt can emit, and how to turn one into
        // a button. TRANSFER_TO_CONCIERGE has no parameter; the rest carry
        // a Shopify handle after a colon, e.g. [VIEW_PRODUCT:pierre-blanche].
        const TAG_HANDLERS = {
            TRANSFER_TO_CONCIERGE: () => ({
                text: 'Contact Personal Concierge',
                url: gmailComposeLink()
            }),
            VIEW_MEMBERSHIP: () => ({
                text: 'Enter The Renaissance Circle',
                url: SITE_ORIGIN + '/products/patron-membership'
            }),
            VIEW_PORTAL: () => ({
                text: 'Open the Private Client Portal',
                url: CLUB_PORTAL_URL
            }),
            VIEW_COLLECTION: (handle) => ({
                text: 'View the Collection',
                url: SITE_ORIGIN + '/collections/' + handle
            }),
            VIEW_PRODUCT: (handle) => ({
                text: 'View the Object',
                url: SITE_ORIGIN + '/products/' + handle
            }),
            REGISTER_INTEREST: (handle) => ({
                text: 'Register Private Interest',
                url: gmailComposeLink('Private Registry — ' + (PRODUCT_LABELS[handle] || humanizeHandle(handle)))
            })
        };
        const TAG_PATTERN = /\[(TRANSFER_TO_CONCIERGE|VIEW_MEMBERSHIP|VIEW_PORTAL|VIEW_COLLECTION|VIEW_PRODUCT|REGISTER_INTEREST)(?::([a-z0-9-]+))?\]/g;

        let chatContext = [];

        const chatSpace = document.getElementById('chatSpace');
        const chatInputField = document.getElementById('chatInputField');
        const sendChatBtn = document.getElementById('sendChatBtn');
        const resetSessionBtn = document.getElementById('resetSessionBtn');

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.cinematic-fade').forEach((el, index) => {
                setTimeout(() => { el.classList.add('is-visible'); }, index * 120 + 100);
            });

            const savedSession = localStorage.getItem(STORAGE_KEY);
            if (savedSession) {
                try {
                    chatContext = JSON.parse(savedSession);
                    if (chatContext.length > 0) {
                        chatContext.forEach(msg => {
                            if (msg.role === 'user') {
                                displayMessage(msg.text, 'user');
                            } else {
                                renderBotMessageWithTags(msg.text);
                            }
                        });
                    } else {
                        triggerCuratorGreeting();
                    }
                } catch (e) {
                    console.error("Session storage read error", e);
                    triggerCuratorGreeting();
                }
            } else {
                triggerCuratorGreeting();
            }
        });

        function saveSession() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatContext));
        }

        resetSessionBtn.addEventListener('click', () => {
            chatContext = [];
            localStorage.removeItem(STORAGE_KEY);
            chatSpace.innerHTML = '';
            triggerCuratorGreeting();
        });

        function triggerCuratorGreeting() {
            const greeting = "Welcome to the Spring Renaissance curatorial space. I am your personal assistant on The Renaissance Circle, the Maison's private membership, and on Jardin Fermé, our first collection open to direct order. Ask about either, or about the philosophy behind the Maison.";
            renderBotMessageWithTags(greeting);
            chatContext.push({ role: "model", text: greeting });
            saveSession();
        }

        sendChatBtn.addEventListener('click', processUserMessage);
        chatInputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processUserMessage();
        });

        function processUserMessage() {
            const textContent = chatInputField.value.trim();
            if (!textContent) return;

            displayMessage(textContent, "user");
            chatContext.push({ role: "user", text: textContent });
            saveSession();

            chatInputField.value = '';
            transmitDataToBackend(textContent);
        }

        function displayMessage(text, side) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${side}`;

            const card = document.createElement('div');
            card.className = 'msg-card';

            if (text) {
                const textParagraph = document.createElement('p');
                textParagraph.innerHTML = text.replace(/\n/g, '<br>');
                card.appendChild(textParagraph);
            }

            wrapper.appendChild(card);
            chatSpace.appendChild(wrapper);

            setTimeout(() => {
                chatSpace.scrollTop = chatSpace.scrollHeight;
            }, 50);

            return card;
        }

        function renderBotMessageWithTags(rawText) {
            let displayText = rawText;
            const activeButtons = [];
            const seen = new Set();

            let match;
            TAG_PATTERN.lastIndex = 0;
            while ((match = TAG_PATTERN.exec(rawText)) !== null) {
                const [fullTag, tagName, handle] = match;
                const handler = TAG_HANDLERS[tagName];
                if (!handler) continue;
                const key = tagName + ':' + (handle || '');
                if (seen.has(key)) continue; // a tag repeated in one reply only gets one button
                seen.add(key);
                activeButtons.push(handler(handle));
            }
            displayText = displayText.replace(TAG_PATTERN, '').trim();

            const outputCardElement = displayMessage(displayText, "bot");

            if (activeButtons.length > 0) {
                const actionBlock = document.createElement('div');
                actionBlock.className = 'concierge-action-block';

                activeButtons.forEach(btnConfig => {
                    const linkButton = document.createElement('a');
                    linkButton.href = btnConfig.url;
                    linkButton.target = "_blank";
                    linkButton.rel = "noopener";
                    linkButton.className = 'concierge-luxury-btn';
                    linkButton.innerText = btnConfig.text;
                    actionBlock.appendChild(linkButton);
                });

                outputCardElement.appendChild(actionBlock);
                chatSpace.scrollTop = chatSpace.scrollHeight;
            }
        }

        async function transmitDataToBackend(text) {
            const typingWrapper = document.createElement('div');
            typingWrapper.className = 'msg-wrapper bot';
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'curator-typing';
            typingIndicator.innerText = "Curator is crafting a response...";
            typingWrapper.appendChild(typingIndicator);
            chatSpace.appendChild(typingWrapper);
            chatSpace.scrollTop = chatSpace.scrollHeight;

            const payload = {
                message: text,
                history: chatContext.slice(0, -1)
            };

            try {
                const response = await fetch(PIPEDREAM_WORKFLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Status ${response.status}`);

                const serverResult = await response.json();
                typingWrapper.remove();

                let textReply = "";
                if (typeof serverResult === 'string') {
                    textReply = serverResult;
                } else {
                    textReply = serverResult.reply || serverResult.response || serverResult.text || JSON.stringify(serverResult);
                }

                if (typeof textReply === 'string') {
                    const trimmed = textReply.trim();
                    if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                        try {
                            const innerJson = JSON.parse(trimmed);
                            textReply = innerJson.text || innerJson.response || innerJson.reply || textReply;
                        } catch (e) {}
                    } else if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                        try {
                            const innerArray = JSON.parse(trimmed);
                            if (innerArray.length > 0 && innerArray[0].text) {
                                textReply = innerArray[0].text;
                            }
                        } catch (e) {}
                    }
                }

                if (textReply) {
                    chatContext.push({ role: "model", text: textReply });
                    saveSession();
                    renderBotMessageWithTags(textReply);
                }
            } catch (err) {
                console.error("Transmission breakdown:", err);
                if (typingWrapper.parentNode) typingWrapper.remove();
                displayMessage("We apologize for the inconvenience, there were temporary difficulties in communicating with the server. Please try again later.", "bot");
                chatContext.pop();
                saveSession();
            }
        }
    </script>
</body>
</html>
